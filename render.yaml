services:
  - type: web
    runtime: python
    name: styleshop-api
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate --noinput && python manage.py seed_clothes
    startCommand: gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: styleshop-storefront
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    runtime: static
    name: styleshop-storefront
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: styleshop-api
          envVarKey: RENDER_EXTERNAL_URL
